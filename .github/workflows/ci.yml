name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-gateway:
    name: Go Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/gateway/

      - name: Test
        run: go test ./internal/gateway/ -v -race -coverprofile=coverage-gateway.out

      - name: Coverage
        run: go tool cover -func=coverage-gateway.out | tail -1

  go-operator:
    name: Go Operator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Build
        run: make build

      - name: Generate manifests
        run: make manifests

      - name: Setup envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23

      - name: Test
        run: |
          export KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.0 -p path)
          go test ./internal/controller/ -v -race -coverprofile=coverage-operator.out

      - name: Coverage
        run: go tool cover -func=coverage-operator.out | tail -1

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v --tb=short

  python-eval:
    name: Python Eval Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SDK (dependency)
        run: pip install -e "../clients/python"

      - name: Install eval
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v --tb=short

  wer-regression:
    name: WER Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start whisper + vad + gateway
        run: docker compose up --build -d whisper vad gateway

      - name: Wait for gateway readiness
        run: timeout 180 bash -c 'until curl -sf http://localhost:8080/readyz; do sleep 5; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SDK + eval harness
        run: pip install -e clients/python -e "eval[dev]"

      - name: Run WER regression check
        run: vox-eval run eval/datasets/sample --url http://localhost:8080 --threshold 0.25

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint faster-whisper
        run: helm lint deploy/helm/faster-whisper

      - name: Lint gateway
        run: helm lint deploy/helm/gateway

      - name: Lint summarizer
        run: helm lint deploy/helm/summarizer

      - name: Lint gpu-metrics
        run: helm lint deploy/helm/gpu-metrics

      - name: Template faster-whisper
        run: helm template whisper deploy/helm/faster-whisper -n vox

      - name: Template gateway
        run: helm template gateway deploy/helm/gateway -n vox

      - name: Template summarizer (CPU default)
        run: helm template summarizer deploy/helm/summarizer -n vox

      - name: Template summarizer (GPU override, iteration 5)
        run: helm template summarizer deploy/helm/summarizer -f deploy/helm/summarizer/values-gpu.yaml -n vox

      - name: Template gpu-metrics
        run: helm template gpu-metrics deploy/helm/gpu-metrics -n vox