---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: evalruns.vox.vox.io
spec:
  group: vox.vox.io
  names:
    kind: EvalRun
    listKind: EvalRunList
    plural: evalruns
    singular: evalrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.passed
      name: Passed
      type: boolean
    - jsonPath: .status.corpusWER
      name: WER
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvalRun is the Schema for the evalruns API.
          It declares a one-shot WER regression check against a gateway, delegates
          execution to an Argo Workflow running the vox-eval harness, and reports the
          resulting pass/fail and metrics.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvalRunSpec defines the desired state of an EvalRun.
              An EvalRun is a one-shot WER regression check: the operator submits a single
              Argo Workflow that runs the vox-eval harness against a gateway, then reflects
              the resulting pass/fail and metrics back into status. It does not create any
              long-lived resources — deleting the EvalRun garbage-collects its Workflow.
            properties:
              dataset:
                description: |-
                  Dataset is the path to the dataset directory (manifest.csv + audio),
                  resolved inside the eval Image — e.g. "datasets/sample".
                type: string
              gatewayURL:
                description: |-
                  GatewayURL is the VoxPlatform gateway endpoint to evaluate against,
                  e.g. "http://gateway.vox.svc.cluster.local:8080".
                type: string
              image:
                description: |-
                  Image is the eval harness container image (bundles vox-eval, the SDK,
                  and the dataset named above).
                type: string
              model:
                description: |-
                  Model optionally pins which model the gateway should use for
                  transcription. Empty means the gateway's default model.
                type: string
              suspend:
                description: |-
                  Suspend prevents the controller from submitting a Workflow for this
                  EvalRun. Existing Workflows are left untouched.
                type: boolean
              timeoutSeconds:
                default: 600
                description: |-
                  TimeoutSeconds bounds how long the underlying Workflow may run before
                  it is forcibly terminated.
                format: int32
                type: integer
              werThreshold:
                default: "0.3"
                description: |-
                  WERThreshold is the maximum acceptable corpus WER; the run is marked
                  Failed if the eval harness reports a higher WER than this.
                type: string
            required:
            - dataset
            - gatewayURL
            - image
            type: object
          status:
            description: EvalRunStatus defines the observed state of an EvalRun.
            properties:
              completionTime:
                description: CompletionTime records when the Workflow reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: Conditions follow the standard Kubernetes conditions
                  pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              corpusWER:
                description: CorpusWER is the corpus-level Word Error Rate reported
                  by the eval harness.
                type: string
              meanWER:
                description: MeanWER is the mean per-sample Word Error Rate reported
                  by the eval harness.
                type: string
              message:
                description: Message provides human-readable status details.
                type: string
              passed:
                description: Passed is true when CorpusWER was within spec.WERThreshold.
                type: boolean
              phase:
                description: |-
                  Phase is the current lifecycle phase.
                  Succeeded means the eval ran AND its corpus WER was within threshold.
                  Failed covers both a WER regression and an infrastructure failure
                  (e.g. the Workflow errored before producing a report).
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startTime:
                description: StartTime records when the Workflow was submitted.
                format: date-time
                type: string
              totalSamples:
                description: TotalSamples is the number of dataset samples evaluated.
                format: int32
                type: integer
              workflowRef:
                description: WorkflowRef is the name of the Argo Workflow object submitted
                  for this run.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
